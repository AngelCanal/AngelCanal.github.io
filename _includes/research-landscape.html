        <canvas class="landscape-canvas" data-landscape-canvas aria-hidden="true"></canvas>
        <div class="landscape-regions" role="group" aria-label="Explore a research question">
          {% for region in landscape.regions %}<a class="landscape-region{% if region[1].status %} landscape-region--wip{% endif %}" data-landscape-region="{{ region[0] }}" data-landscape-region-select="{{ region[0] }}" href="{% if region[1].entry %}#landscape-paper-{{ region[1].entry }}{% else %}#landscape-region-{{ region[0] }}{% endif %}" aria-label="{{ region[1].label | escape }}{% if region[1].status %}. {{ region[1].status | escape }}{% endif %}" style="left: {{ region[1].fallback_x }}%; top: {{ region[1].fallback_y }}%;"><span>{{ region[1].short_label | escape }}</span>{% if region[1].status %}<small>{{ region[1].status | escape }}</small>{% endif %}</a>{% endfor %}
        </div>
        <div class="landscape-markers" role="group" aria-label="Explore a selected study">
          {% for map_entry in landscape.papers %}
          {% assign paper_id = map_entry[0] %}
          {% assign node = map_entry[1] %}
          {% for paper in site.data.publications %}
          {% if paper.id == paper_id %}
          <a class="landscape-marker{% if paper.id == landscape.initial_paper %} is-active{% endif %}" href="#landscape-paper-{{ paper.id }}" data-landscape-marker="{{ paper.id }}" style="left: {{ node.fallback_x }}%; top: {{ node.fallback_y }}%; --label-x: {{ node.label_dx }}px; --label-y: {{ node.label_dy }}px;" aria-label="Study {{ node.number | prepend: '0' }}. {{ node.label | escape }}, {{ paper.year }}. Show paper details and connections" aria-controls="landscape-paper-{{ paper.id }}"{% if paper.id == landscape.initial_paper %} aria-current="true"{% endif %}>
            <span class="landscape-marker-pin" aria-hidden="true"></span>
            <span class="landscape-marker-label"><span class="landscape-marker-number">{{ node.number | prepend: '0' }}</span><span class="landscape-marker-name">{{ node.label | escape }}</span><span class="landscape-marker-year">{{ paper.year }}</span></span>
          </a>
          {% endif %}
          {% endfor %}
          {% endfor %}
        </div>
      </div>
      <div class="landscape-view-footer"><p>Explore a paper or a research question.</p><button class="landscape-reset" type="button" data-landscape-reset hidden>Reset view <span aria-hidden="true">↺</span></button></div>
    </div>

    <div class="landscape-details" data-landscape-details>
      {% assign where = landscape.regions.where %}
      <article class="landscape-detail landscape-detail--wip" id="landscape-region-where" data-landscape-region-detail="where" aria-labelledby="landscape-title-where">
        <p class="landscape-detail-kicker"><span>{{ where.label | escape }}</span><span>{{ where.status | escape }}</span></p>
        <h3 id="landscape-title-where">{{ where.detail_title | escape }}</h3>
        <p class="landscape-detail-summary">{{ where.detail | escape }}</p>
        <div class="landscape-detail-links"><a href="#landscape-paper-{{ landscape.regions.when.entry }}" data-landscape-region-select="when">Explore When <span aria-hidden="true">↗</span></a><a href="#landscape-paper-{{ landscape.regions.how.entry }}" data-landscape-region-select="how">Explore How <span aria-hidden="true">↗</span></a></div>
      </article>
      {% for map_entry in landscape.papers %}
      {% assign paper_id = map_entry[0] %}
      {% assign node = map_entry[1] %}
      {% for paper in site.data.publications %}
      {% if paper.id == paper_id %}
      {% assign region = landscape.regions[node.region] %}
      <article class="landscape-detail{% if paper.id == landscape.initial_paper %} is-active{% endif %}" id="landscape-paper-{{ paper.id }}" data-landscape-detail="{{ paper.id }}" aria-labelledby="landscape-title-{{ paper.id }}">
        <p class="landscape-detail-kicker"><span>{{ node.number | prepend: '0' }} / {{ landscape.papers.size | prepend: '0' }}</span><span>{{ region.label | escape }}</span></p>
        <h3 id="landscape-title-{{ paper.id }}">{{ paper.title | escape }}</h3>
        <p class="landscape-detail-venue">{{ paper.year }}{% if paper.publication_type %} <span aria-hidden="true">·</span> {{ paper.publication_type | escape }}{% endif %}<br>{{ paper.venue | escape }}</p>
        <p class="landscape-detail-summary">{{ paper.summary | escape }}</p>
        <div class="landscape-detail-links">{% if paper.paper and paper.paper != '' %}<a href="{{ paper.paper | escape }}">{{ paper.link_label | default: 'Paper' | escape }} <span aria-hidden="true">↗</span></a>{% endif %}{% if paper.code and paper.code != '' %}<a href="{{ paper.code | escape }}">Code <span aria-hidden="true">↗</span></a>{% endif %}{% if paper.data and paper.data != '' %}<a href="{{ paper.data | escape }}">Data <span aria-hidden="true">↗</span></a>{% endif %}</div>
        {% if paper.link_note %}<p class="landscape-link-note">{{ paper.link_note | escape }}</p>{% endif %}
        <div class="landscape-connections">
          <h4>Connected by</h4>
          <ul>
            {% for connection in landscape.connections %}
            {% assign connected_id = nil %}
            {% if connection.a == paper.id %}{% assign connected_id = connection.b %}{% elsif connection.b == paper.id %}{% assign connected_id = connection.a %}{% endif %}
            {% if connected_id %}{% assign connected_node = landscape.papers[connected_id] %}<li><a href="#landscape-paper-{{ connected_id }}" data-landscape-related="{{ connected_id }}"><span>{{ connection.theme | escape }}</span><span>{{ connected_node.label | escape }} <span aria-hidden="true">↗</span></span></a></li>{% endif %}
            {% endfor %}
          </ul>
        </div>
      </article>
      {% endif %}
      {% endfor %}
      {% endfor %}
    </div>
  </div>
  <figcaption class="landscape-caption" id="landscape-caption"><span class="landscape-caption-mark" aria-hidden="true">+</span><p>Shared topics guide this conceptual layout. Height and distance do not measure similarity.</p><a href="#publications">View all selected publications <span aria-hidden="true">↗</span></a></figcaption>
  <p class="landscape-sr-only" data-landscape-status aria-live="polite" aria-atomic="true"></p>
  <script type="application/json" data-landscape-config>{{ landscape | jsonify }}</script>
</figure>
