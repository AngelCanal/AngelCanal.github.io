{% assign landscape = site.data.landscape %}
<figure class="research-landscape" data-research-landscape aria-labelledby="landscape-figure-title" aria-describedby="landscape-guide landscape-caption">
  <div class="landscape-topline">
    <div><span class="landscape-figure-number">Fig. 02</span><span id="landscape-figure-title">A landscape of connected questions</span></div>
    <span class="landscape-count">{{ site.data.publications.size | prepend: '0' }} selected studies</span>
  </div>

  <p class="landscape-guide" id="landscape-guide">Each region groups related research questions. Select a study to see the shared topics behind its connections.</p>
  <ul class="landscape-legend" aria-label="Research questions grouped by region">
    {% for region in landscape.regions %}<li><span class="landscape-legend-dot landscape-legend-dot--{{ region[0] }}" aria-hidden="true"></span><span><span class="landscape-legend-name">{{ region[1].label | escape }}</span><span class="landscape-legend-question">{{ region[1].question | escape }}</span></span></li>{% endfor %}
  </ul>

          {% for region in landscape.regions %}<span class="landscape-region" data-landscape-region="{{ region[0] }}" style="left: {{ region[1].fallback_x }}%; top: {{ region[1].fallback_y }}%;">{{ region[1].short_label | escape }}</span>{% endfor %}
        </div>
        <div class="landscape-markers" role="group" aria-label="Explore a selected study">
          {% for paper in site.data.publications %}
          {% assign node = landscape.papers[paper.id] %}
          {% if node %}
          <a class="landscape-marker{% if node.secondary %} landscape-marker--secondary{% endif %}{% if forloop.first %} is-active{% endif %}" href="#landscape-paper-{{ paper.id }}" data-landscape-marker="{{ paper.id }}" style="left: {{ node.fallback_x }}%; top: {{ node.fallback_y }}%; --label-x: {{ node.label_dx }}px; --label-y: {{ node.label_dy }}px;" aria-label="Study {{ forloop.index | prepend: '0' }}. {{ node.label | escape }}, {{ paper.year }}. Show paper details and connections" aria-controls="landscape-paper-{{ paper.id }}"{% if forloop.first %} aria-current="true"{% endif %}>
            <span class="landscape-marker-pin" aria-hidden="true"></span>
            <span class="landscape-marker-label"><span class="landscape-marker-number">{{ forloop.index | prepend: '0' }}</span><span class="landscape-marker-name">{{ node.label | escape }}</span><span class="landscape-marker-year">{{ paper.year }}</span></span>
          </a>
          {% endif %}
          {% endfor %}
        </div>

    <div class="landscape-details" data-landscape-details>
      {% for paper in site.data.publications %}
      {% assign node = landscape.papers[paper.id] %}
      {% if node %}
      {% assign region = landscape.regions[node.region] %}
      <article class="landscape-detail{% if forloop.first %} is-active{% endif %}" id="landscape-paper-{{ paper.id }}" data-landscape-detail="{{ paper.id }}" aria-labelledby="landscape-title-{{ paper.id }}">
        <p class="landscape-detail-kicker"><span>{{ forloop.index | prepend: '0' }} / {{ site.data.publications.size | prepend: '0' }}</span><span>{{ region.label | escape }}</span></p>
        <h3 id="landscape-title-{{ paper.id }}">{{ paper.title | escape }}</h3>
        <p class="landscape-detail-venue">{{ paper.year }} <span aria-hidden="true">·</span> {{ paper.venue | escape }}</p>
        <p class="landscape-detail-summary">{{ paper.summary | escape }}</p>
        <div class="landscape-detail-links">{% if paper.paper and paper.paper != '' %}<a href="{{ paper.paper | escape }}">Read paper <span aria-hidden="true">↗</span></a>{% endif %}{% if paper.code and paper.code != '' %}<a href="{{ paper.code | escape }}">Code <span aria-hidden="true">↗</span></a>{% endif %}{% if paper.data and paper.data != '' %}<a href="{{ paper.data | escape }}">Data <span aria-hidden="true">↗</span></a>{% endif %}</div>
        <div class="landscape-connections">
          <h4>Connected by</h4>
          <ul>
            {% for connection in landscape.connections %}
            {% assign connected_id = nil %}
            {% if connection.a == paper.id %}{% assign connected_id = connection.b %}{% elsif connection.b == paper.id %}{% assign connected_id = connection.a %}{% endif %}
            {% if connected_id %}{% assign connected_node = landscape.papers[connected_id] %}<li><a href="#landscape-paper-{{ connected_id }}" data-landscape-related="{{ connected_id }}"><span>{{ connection.theme | escape }}</span><span>{{ connected_node.label | escape }} <span aria-hidden="true">↗</span></span></a></li>{% endif %}
            {% endfor %}
          </ul>
        </div>
      </article>
      {% endif %}
      {% endfor %}
    </div>
  </div>
  <figcaption class="landscape-caption" id="landscape-caption"><span class="landscape-caption-mark" aria-hidden="true">+</span><p>Shared topics guide this conceptual layout. Height and distance do not measure similarity.</p><a href="#publications">View all selected publications <span aria-hidden="true">↗</span></a></figcaption>
  <p class="landscape-sr-only" data-landscape-status aria-live="polite" aria-atomic="true"></p>
  <script type="application/json" data-landscape-config>{{ landscape | jsonify }}</script>
