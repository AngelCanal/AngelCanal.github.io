title: Ángel Canal-Alonso
description: "Where, when and how to stimulate in epilepsy. Ángel Canal-Alonso studies neuromodulation through dynamical systems, modelling and reservoir computing for implantable devices."
url: "https://acanal.me"
baseurl: ""
lang: en
markdown: kramdown
permalink: pretty
timezone: Europe/Berlin
# The standalone design preview adds its own banner.
demo_mode: false
show_notes: false
# Observatory, the selected design.
design: manuscript
collections:
  projects:
    output: true
    permalink: /research/:name/
  notes:
    output: true
    permalink: /notes/:name/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: article
  - scope:
      path: ""
      type: notes
    values:
      layout: article
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - design
  - scripts
  - node_modules

