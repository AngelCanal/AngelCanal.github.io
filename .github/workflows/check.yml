name: Check Jekyll site

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify the Kuramoto reconstruction and intervention
        run: node scripts/check-kuramoto.cjs
      - name: Build with the GitHub Pages Jekyll environment
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check required output
        run: |
          test -s _site/index.html
          test -s _site/assets/css/site.css
          test -s _site/assets/js/site.js
          test -s _site/assets/js/kuramoto.js
          test -s _site/assets/js/landscape.js
          test -s _site/assets/css/landscape.css
          test -s _site/assets/figures/kuramoto-static.svg
          test -s _site/CNAME
          test -s _site/research/01-a-question-made-visible/index.html
          test -s _site/research/02-a-different-view/index.html
      - name: Check versioned styles and script loading
        run: python3 scripts/check-assets.py _site
      - name: Check crawler files and research metadata
        run: python3 scripts/check-discovery.py _site
      - uses: actions/upload-artifact@v4
        with:
          name: jekyll-site-preview
          path: _site/
          retention-days: 7
