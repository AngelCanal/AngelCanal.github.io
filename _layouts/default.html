<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101312">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/landscape.css' | relative_url }}">
  <script defer src="{{ '/assets/js/kuramoto.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/site.js' | relative_url }}"></script>
  <script defer src="{{ '/assets/js/landscape.js' | relative_url }}"></script>
</head>
<body data-design="{{ site.design | default: 'manuscript' }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% if site.demo_mode %}<div class="draft-banner">Design draft <span>·</span> Research summaries for review</div>{% endif %}
  <header class="site-header wrap">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="{{ site.data.profile.name | escape }}, home"><span class="brand-mark" aria-hidden="true">a<span>c</span></span><span class="brand-domain">acanal.me</span></a>
    <nav aria-label="Main navigation">
      <a href="{{ '/' | relative_url }}#research">Research</a>
      <a href="{{ '/' | relative_url }}#publications">Publications</a>
      <a href="{{ '/' | relative_url }}#about">About</a>
      <a class="nav-contact" href="{{ '/' | relative_url }}#contact">Contact <span aria-hidden="true">↗</span></a>
    </nav>
  </header>
  <main id="main">{{ content }}</main>
  <footer class="site-footer wrap"><a class="brand-domain" href="{{ '/' | relative_url }}">acanal.me</a><p>{{ site.data.profile.name | escape }} <span>·</span> Research & a little more.</p><a href="#main">Back to top ↑</a></footer>
</body>
</html>
